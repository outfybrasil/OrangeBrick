<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Criar novo Brick — OrangeBrick</title>
<style>
:root{color-scheme:dark;--bg:#090a0c;--modal:#191a1f;--input:#0e0f12;--line:#303137;--text:#f1f1f3;--muted:#96979e;--orange:#ff6500}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--text);font:14px/1.45 Inter,"Segoe UI",Arial,sans-serif}button,textarea,input{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--orange);outline-offset:3px}
.stage{position:fixed;inset:0;background:#0005}.modal{position:relative;width:min(100%,520px);border:1px solid #35363d;border-radius:16px;background:var(--modal);box-shadow:0 18px 55px #0008;overflow:hidden}
.head{height:82px;display:flex;align-items:center;padding:0 24px;border-bottom:1px solid var(--line)}.mark{display:grid;place-items:center;width:28px;height:28px;color:var(--orange);margin-right:11px}.mark svg{width:20px;height:20px}.head h1{font-size:17px;line-height:1.2;margin:0;font-weight:720;letter-spacing:-.2px}.close{margin-left:auto;width:32px;height:32px;border:0;background:transparent;border-radius:5px;color:#a1a2a9;display:grid;place-items:center}.close:hover{background:#ffffff0a;color:#fff}.close svg{width:17px;height:17px}
.body{padding:17px 24px 0}textarea{display:block;width:100%;height:110px;resize:vertical;min-height:84px;max-height:230px;padding:14px;background:var(--input);border:1px solid #303137;border-radius:14px;color:var(--text);font-size:14px;line-height:1.5}textarea::placeholder{color:#81828a}
.meta{display:flex;justify-content:space-between;gap:14px;padding:9px 0 16px;color:var(--muted);font-size:12px}.meta span:first-child{max-width:360px}.count{font-variant-numeric:tabular-nums;white-space:nowrap}.count.near{color:#ffb17d}.count.over{color:#ff7979}.rule{height:1px;background:var(--line)}
.tools{display:flex;align-items:center;gap:9px;padding:12px 0 20px}.tool{height:37px;display:inline-flex;align-items:center;gap:8px;padding:0 12px;border:1px solid #383940;background:#1e1f24;color:#c8c8cd;font-size:12px;font-weight:650}.tool:hover{border-color:#606168;color:white}.tool svg{height:16px;width:16px;color:var(--orange)}.tool[aria-pressed=true]{border-color:#96502d;color:#ff995f;background:#24201e}.tool[aria-pressed=true] svg{color:#ff995f}
.optional{margin:0 0 9px;color:#b1b1b7;font-size:11px;letter-spacing:.045em;font-weight:700}.optional span{color:#85868d;font-weight:400;letter-spacing:0;margin-left:5px}.platforms{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:19px}.platform{height:41px;min-width:58px;padding:0 12px;border:1px solid #35363c;background:#15161a;color:#bcbcc2;font-size:12px;font-weight:650}.platform:hover{border-color:#66676f;color:white}.platform[aria-pressed=true]{border-color:var(--orange);background:#211a16;color:#ff985d}
.spoiler-note{border-top:1px solid var(--line);padding:13px 0 15px;display:flex;align-items:center;gap:9px;cursor:pointer}.spoiler-note input{appearance:none;width:15px;height:15px;margin:0;border:1px solid #686970;background:#111216;border-radius:2px;display:grid;place-items:center;flex:none}.spoiler-note input:checked{background:var(--orange);border-color:var(--orange)}.spoiler-note input:checked:after{content:"✓";color:#17120f;font-size:11px;font-weight:800}.spoiler-note span{font-size:12px;color:#a6a7ad}
.foot{min-height:68px;border-top:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;justify-content:flex-end;gap:9px}.cancel,.publish{height:42px;padding:0 17px;border-radius:2px;font-size:13px;font-weight:700}.cancel{border:1px solid transparent;background:transparent;color:#b6b6bd}.cancel:hover{color:white;background:#ffffff08}.publish{min-width:120px;border:1px solid var(--orange);background:var(--orange);color:#19120e}.publish:hover:not(:disabled){background:#ff7921}.publish:disabled{border-color:#713b21;background:#713b21;color:#d5a181;cursor:not-allowed}
.preview{display:flex;align-items:center;gap:10px;padding:9px;border:1px solid #383940;background:#121317;margin:0 0 15px}.preview img{width:56px;height:48px;object-fit:cover}.preview .filename{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#c9c9ce;font-size:12px}.remove{background:none;border:0;color:#aaa;font-size:12px}.remove:hover{color:#fff}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.toast{position:fixed;bottom:17px;left:50%;transform:translateX(-50%);background:#23242a;border:1px solid #414249;padding:10px 14px;color:#eee;border-radius:4px;font-size:12px;max-width:90vw}[hidden]{display:none!important}
@media(max-width:540px){body{padding:0;display:block;background:var(--modal)}.stage{display:none}.modal{width:100%;min-height:100dvh;border:0;border-radius:0;display:flex;flex-direction:column}.head{height:70px;padding:0 17px}.body{padding:15px 17px 0;flex:1}.meta{font-size:11px}.platforms{gap:7px}.platform{height:38px;min-width:52px;padding:0 10px}.foot{padding:12px 17px}.cancel,.publish{height:42px}}
</style></head>
<body><div class="stage" aria-hidden="true"></div>
<main class="modal" aria-labelledby="title">
<header class="head"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h14v10H5zM8 9V6h8v3M10 6V4h4v2"/><path d="M8 13h3m2 0h3"/></svg></span><h1 id="title">Criar novo Brick</h1><button class="close" type="button" aria-label="Fechar" data-close><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header>
<form id="form"><div class="body">
<label class="sr" for="text">Texto da publicação</label><textarea id="text" maxlength="280" placeholder="Qual é a sua leitura sobre esse anúncio ou jogo?" aria-describedby="guidance count"></textarea>
<div class="meta"><span id="guidance">Debate firme, ataque pessoal não. Marque spoilers antes de publicar.</span><span class="count" id="count" aria-live="polite">0/280</span></div><div class="rule"></div>
<div class="tools"><button class="tool" type="button" id="attach"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m8 12 6-6a4 4 0 0 1 6 6l-8 8a6 6 0 0 1-9-8l7-7"/><path d="m8 16 8-8"/></svg>Anexar imagem</button><input class="sr" type="file" id="file" accept="image/png,image/jpeg,image/webp"><button class="tool" type="button" id="spoiler-toggle" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>Spoiler</button></div>
<div class="preview" id="preview" hidden><img id="preview-img" alt="Prévia da imagem anexada"><span class="filename" id="filename"></span><button class="remove" id="remove" type="button">Remover</button></div>
<p class="optional">PLATAFORMA <span>OPCIONAL · escolha uma ou mais</span></p>
<div class="platforms" aria-label="Selecionar plataformas"><button class="platform" type="button" aria-pressed="false">PS5</button><button class="platform" type="button" aria-pressed="false">XSX</button><button class="platform" type="button" aria-pressed="false">SWITCH 2</button><button class="platform" type="button" aria-pressed="false">PC</button><button class="platform" type="button" aria-pressed="false">MOBILE</button></div>
<label class="spoiler-note"><input type="checkbox" id="spoiler"><span>Esta publicação contém spoilers</span></label>
</div><footer class="foot"><button class="cancel" type="button" data-close>Cancelar</button><button class="publish" id="publish" type="submit" disabled>Publicar Brick</button></footer></form>
</main><div class="toast" id="toast" role="status" hidden></div>
<script>
const text=document.querySelector('#text'),count=document.querySelector('#count'),publish=document.querySelector('#publish'),file=document.querySelector('#file'),preview=document.querySelector('#preview'),toast=document.querySelector('#toast');let imageUrl='';
function say(s){toast.textContent=s;toast.hidden=false;clearTimeout(window.tt);window.tt=setTimeout(()=>toast.hidden=true,2600)}
function update(){const n=text.value.length;count.textContent=n+'/280';count.classList.toggle('near',n>245&&n<=280);count.classList.toggle('over',n>280);publish.disabled=!(text.value.trim()||imageUrl)}
text.addEventListener('input',update);
document.querySelector('#attach').onclick=()=>file.click();
file.onchange=()=>{const f=file.files[0];if(!f)return;if(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>5*1024*1024){say('Escolha uma imagem PNG, JPG ou WebP de até 5 MB.');file.value='';return}if(imageUrl)URL.revokeObjectURL(imageUrl);imageUrl=URL.createObjectURL(f);document.querySelector('#preview-img').src=imageUrl;document.querySelector('#filename').textContent=f.name;preview.hidden=false;update()};
document.querySelector('#remove').onclick=()=>{URL.revokeObjectURL(imageUrl);imageUrl='';file.value='';preview.hidden=true;update()};
document.querySelectorAll('.platform').forEach(b=>b.onclick=()=>b.setAttribute('aria-pressed',String(b.getAttribute('aria-pressed')!=='true')));
const toggle=document.querySelector('#spoiler-toggle'),check=document.querySelector('#spoiler');
toggle.onclick=()=>{const v=toggle.getAttribute('aria-pressed')!=='true';toggle.setAttribute('aria-pressed',String(v));check.checked=v};
check.onchange=()=>toggle.setAttribute('aria-pressed',String(check.checked));
document.querySelector('#form').onsubmit=e=>{e.preventDefault();if(publish.disabled)return;say('Prévia demonstrativa: publicação não enviada ao site.')};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>say('Fechar é uma ação demonstrativa neste arquivo.'));
</script></body></html>
