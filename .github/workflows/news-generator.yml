name: daily-news-generator

on:
  workflow_dispatch:
    inputs:
      slot:
        description: Horário editorial em Brasília
        required: true
        type: choice
        options:
          - "11"
          - "17"
          - "20"

permissions: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 6
    steps:
      - name: Executar gerador de notícias editorial Orange Brick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEWS_SLOT: ${{ inputs.slot }}
        run: |
          curl --fail --show-error --silent --max-time 300 --get \
            --data-urlencode "slot=$NEWS_SLOT" \
            "https://orangebrick.blog/api/cron/generate-daily" \
            -H "Authorization: Bearer $CRON_SECRET"
